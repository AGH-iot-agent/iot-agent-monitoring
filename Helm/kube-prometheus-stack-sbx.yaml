# -- k3s does not expose these control-plane components; skip scraping
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

grafana:
  image:
    repository: iot-agent-grafana
    tag: latest
    pullPolicy: Never
  adminPassword: admin
  service:
    type: ClusterIP
  defaultDashboardsTimezone: Europe/Warsaw
  persistence:
    enabled: true
    size: 2Gi
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://iot-agent-loki.iotag-monitoring.svc.cluster.local:3100
      editable: true

prometheus:
  prometheusSpec:
    retention: 14d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    storageSpec:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 20Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          resources:
            requests:
              storage: 5Gi
