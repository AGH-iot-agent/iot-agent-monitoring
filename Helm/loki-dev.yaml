deploymentMode: SingleBinary

loki:
  image:
    registry: docker.io
    repository: grafana/loki
    tag: 3.4.2
    pullPolicy: IfNotPresent
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 10Gi

read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

monitoring:
  serviceMonitor:
    enabled: true
