name: CI

on:
  push:
    branches: [main, feat/iot-agent-monitoring]
  pull_request:
    branches: [main, feat/iot-agent-monitoring]
  workflow_dispatch:

concurrency:
  group: iot-agent-monitoring-${{ github.event_name == 'pull_request' && 'sbx' || 'dev' }}
  cancel-in-progress: false

env:
  KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  IMAGE_OUTPUT_DIR: /mnt/storage/iot-agent/docker-local

jobs:
  build-grafana:
    runs-on: [self-hosted, iot-agent-local]
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: tag
        run: echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Build Grafana image
        run: |
          set -euo pipefail
          IMAGE="iot-agent-grafana:${{ steps.tag.outputs.value }}"
          docker build -f Dockerfile -t "$IMAGE" .
          # also tag as latest for convenience
          docker tag "$IMAGE" iot-agent-grafana:latest

      - name: Save & import to k3s
        run: |
          set -euo pipefail
          IMAGE="iot-agent-grafana:${{ steps.tag.outputs.value }}"
          ARCHIVE_DIR="$IMAGE_OUTPUT_DIR/iot-agent-grafana"
          mkdir -p "$ARCHIVE_DIR"
          ARCHIVE="$ARCHIVE_DIR/iot-agent-grafana__${{ steps.tag.outputs.value }}.tar"
          docker save -o "$ARCHIVE" "$IMAGE" iot-agent-grafana:latest

          SUDO=""
          command -v sudo >/dev/null && SUDO="sudo"

          K3S_SOCK="/run/k3s/containerd/containerd.sock"
          [[ -S "$K3S_SOCK" ]] || { echo "ERROR: k3s containerd socket not found — mount /run/k3s from the k3s host"; exit 1; }

          if command -v ctr >/dev/null 2>&1; then
            $SUDO "$(command -v ctr)" --address "$K3S_SOCK" -n k8s.io images import "$ARCHIVE"
          elif command -v k3s >/dev/null 2>&1; then
            $SUDO "$(command -v k3s)" ctr images import "$ARCHIVE"
          else
            echo "ERROR: Neither ctr nor k3s found in PATH"
            exit 1
          fi
          echo "Imported $IMAGE into k3s"

  deploy-monitoring:
    runs-on: [self-hosted, iot-agent-local]
    needs: build-grafana
    env:
      MONITORING_NAMESPACE: iotag-monitoring
      ENVIRONMENT:      ${{ github.event_name == 'pull_request' && 'sbx' || 'dev' }}
      KPS_VALUES:       ${{ github.event_name == 'pull_request' && 'Helm/kube-prometheus-stack-sbx.yaml' || 'Helm/kube-prometheus-stack-dev.yaml' }}
      LOKI_VALUES:      ${{ github.event_name == 'pull_request' && 'Helm/loki-sbx.yaml' || 'Helm/loki-dev.yaml' }}
      PROMTAIL_VALUES:  ${{ github.event_name == 'pull_request' && 'Helm/promtail-sbx.yaml' || 'Helm/promtail-dev.yaml' }}
      IMAGE_TAG:        ${{ needs.build-grafana.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Verify runner prerequisites
        run: |
          set -euo pipefail
          [[ -f "$KUBECONFIG" ]]       || { echo "ERROR: Missing kubeconfig at $KUBECONFIG"; exit 1; }
          [[ -f "$KPS_VALUES" ]]       || { echo "ERROR: Missing values file $KPS_VALUES"; exit 1; }
          [[ -f "$LOKI_VALUES" ]]      || { echo "ERROR: Missing values file $LOKI_VALUES"; exit 1; }
          [[ -f "$PROMTAIL_VALUES" ]]  || { echo "ERROR: Missing values file $PROMTAIL_VALUES"; exit 1; }
          kubectl version --client && helm version

      - name: Add Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts >/dev/null 2>&1 || true
          helm repo add grafana https://grafana.github.io/helm-charts >/dev/null 2>&1 || true
          helm repo update >/dev/null

      - name: Deploy kube-prometheus-stack (with custom Grafana image)
        run: |
          set -euo pipefail
          helm upgrade --install iot-agent-monitoring prometheus-community/kube-prometheus-stack \
            --namespace "$MONITORING_NAMESPACE" \
            --create-namespace \
            -f "$KPS_VALUES" \
            --set grafana.image.tag="$IMAGE_TAG" \
            --wait --timeout 20m

      - name: Deploy Loki
        run: |
          helm upgrade --install iot-agent-loki grafana/loki \
            --namespace "$MONITORING_NAMESPACE" \
            -f "$LOKI_VALUES" \
            --wait --timeout 20m

      - name: Deploy Promtail
        run: |
          helm upgrade --install iot-agent-promtail grafana/promtail \
            --namespace "$MONITORING_NAMESPACE" \
            -f "$PROMTAIL_VALUES" \
            --wait --timeout 20m

      - name: Apply ServiceMonitors
        run: |
          set -euo pipefail
          SM_FILE="k8s/servicemonitors/iot-platform-${ENVIRONMENT}.yaml"
          [[ -f "$SM_FILE" ]] && kubectl apply -f "$SM_FILE" || echo "WARN: $SM_FILE not found, skipping"

      - name: Verify deployment
        if: always()
        run: |
          kubectl -n "$MONITORING_NAMESPACE" get pods
          kubectl -n "$MONITORING_NAMESPACE" get servicemonitors 2>/dev/null || true
          echo "Monitoring deployed — profile: $ENVIRONMENT, grafana image tag: $IMAGE_TAG"
