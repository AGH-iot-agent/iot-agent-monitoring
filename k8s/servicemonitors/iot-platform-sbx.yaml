apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: iot-platform-sbx
  namespace: iotag-monitoring
  labels:
    release: iot-agent-monitoring
spec:
  namespaceSelector:
    matchNames:
      - iotag-sbx
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
          - iot-agent-alert-api
          - iot-agent-authentication
          - iot-agent-dashboard-api
          - iot-agent-device-api
          - iot-agent-gateway-api
          - iot-agent-logs
          - iot-agent-mqtt-broker
          - iot-agent-sim-devices
          - iot-agent-stream-worker
  endpoints:
    - port: default-service
      path: /actuator/prometheus
      interval: 30s
      scrapeTimeout: 10s
